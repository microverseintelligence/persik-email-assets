name: decode
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          for f in b64/*.b64; do base64 -d "$f" > "img/$(basename "$f" .b64)"; done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add img; git diff --cached --quiet || git commit -m "decode images" && git push
